apiVersion: v1
kind: Service
metadata:
  name: elowen-api
spec:
  selector:
    app: elowen-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elowen-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elowen-api
  template:
    metadata:
      labels:
        app: elowen-api
    spec:
      containers:
        - name: elowen-api
          image: ghcr.io/elowen-assistant/elowen-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: elowen-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elowen-secrets
                  key: OPENAI_API_KEY
            - name: ELOWEN_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elowen-secrets
                  key: ELOWEN_UI_PASSWORD
            - name: ELOWEN_ORCHESTRATOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: elowen-secrets
                  key: ELOWEN_ORCHESTRATOR_SIGNING_KEY
                  optional: true
            - name: ELOWEN_ORCHESTRATOR_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: elowen-secrets
                  key: ELOWEN_ORCHESTRATOR_SIGNING_KEYS
                  optional: true
            - name: ELOWEN_REVOKED_EDGE_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: elowen-secrets
                  key: ELOWEN_REVOKED_EDGE_PUBLIC_KEYS
                  optional: true
          volumeMounts:
            - name: ui-auth-config
              mountPath: /run/elowen-env
              readOnly: true
            - name: orchestrator-signer
              mountPath: /run/elowen-secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ui-auth-config
          secret:
            secretName: elowen-ui-auth-config
            optional: true
        - name: orchestrator-signer
          secret:
            secretName: elowen-orchestrator-signer
            optional: true
